name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: actuated-8cpu-12gb
    permissions:
      actions: read
      checks: write
      contents: read
      issues: read
      packages: write
      pull-requests: read
      repository-projects: read
      statuses: read
    steps:
      - uses: self-actuated/hub-mirror@master

      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      # When this runs, it removes the registry mirror, so we have to disable
      # it on actuated builds
      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v2
      - name: Login to Docker Registry
        uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Get TAG
        id: get_tag
        run: echo TAG=${GITHUB_REF#refs/tags/} >> $GITHUB_ENV
      - name: Get public key
        id: get_pub_key
        run: echo "PUBLIC_KEY=$(cat ./key.pub | base64 --wrap 0)" >> $GITHUB_ENV
      - name: Get git commit
        id: get_git_commit
        run: echo "GIT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
      - name: Get version
        id: get_version
        run: echo "VERSION=$(git describe --tags --dirty)" >> $GITHUB_ENV
      - name: Get Repo Owner
        id: get_repo_owner
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" > $GITHUB_ENV

      - name: Push containers
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          outputs: "type=registry,push=true"
          platforms: linux/amd64,linux/arm64,darwin/arm64
          build-args: |
            GIT_COMMIT=${{ env.GIT_COMMIT }}
            VERSION=${{ env.VERSION }}
            PUBLIC_KEY=${{ env.PUBLIC_KEY }}
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/signet:${{ github.sha }}
            ghcr.io/${{ env.REPO_OWNER }}/signet:${{ env.TAG }}
            ghcr.io/${{ env.REPO_OWNER }}/signet:latest
