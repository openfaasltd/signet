# Master key secret: generated by the chart (or operator-supplied) and kept on
# upgrade. Mounted as a file only.
{{- if not (lookup "v1" "Secret" .Release.Namespace (printf "%s-master" (include "signet.fullname" .))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-master" (include "signet.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
    "signet.openfaas.com/managed": "true"
  labels:
    {{- include "signet.labels" . | nindent 4 }}
type: Opaque
stringData:
  master.key: {{ include "signet.masterKey" . | quote }}
{{- end }}
---
# Admin token secret: generated by the chart and kept on upgrade so it stays
# retrievable. Mounted as a file and consumed via --admin-token-file.
{{- if not (lookup "v1" "Secret" .Release.Namespace (printf "%s-admin-token" (include "signet.fullname" .)) ) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-admin-token" (include "signet.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    {{- include "signet.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-token: {{ include "signet.adminToken" . | quote }}
{{- end }}
---
# Seed config secret: the operator-provided config.json written to a Secret and
# mounted as a file at /etc/signet/config.json. Imported on the store's first
# run only.
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-config" (include "signet.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "signet.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.json: {{ .Values.config | default "{}" | quote }}
{{- if .Values.license.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.license.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "signet.labels" . | nindent 4 }}
type: Opaque
stringData:
  license: {{ .Values.license.license | quote }}
{{- end }}
