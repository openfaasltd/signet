# Signet chart defaults
image:
  repository: ttl.sh/signet
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

issuer: "http://signet.openfaas.svc:8080"
listen: ":8080"

# Seed config JSON written to the signet-config Secret as config.json and
# imported on the store's first run. Provide users + clients here.
config: |
  {
    "issuer": "http://signet.openfaas.svc:8080",
    "users": [
      { "username": "admin", "password": "change-me", "subject": "admin", "name": "Signet Admin", "email": "admin@example.com", "groups": ["admin"] }
    ],
    "clients": [
      { "id": "openfaas", "secret": "change-me", "redirect_urls": ["http://127.0.0.1:3000/callback"] }
    ]
  }

# Master key that encrypts config.json, signet.key and admin-token at rest.
# Leave empty to have the chart generate a random 32-byte key on install. NEVER
# pass via env var; it is mounted as a file and consumed via --master-key-file.
masterKey: ""

# Admin (management) token, created by the chart as a retrievable Secret and
# mounted as a file via --admin-token-file. The operator can always retrieve it
# rather than scraping a first-run log. Leave empty to have the chart generate
# a random one on install.
adminToken: ""

license:
  # Set to true and provide secretName + a `license` key (file contents) to
  # mount a license. Leave disabled to run without a license file.
  enabled: false
  secretName: "signet-license"
  license: ""

service:
  type: ClusterIP
  port: 8080
  # nodePort: 30080

storage:
  className: local-path
  size: 1Gi
  mountPath: /var/lib/signet

securityContext:
  runAsUser: 65532
  runAsNonRoot: true

resources: {}
