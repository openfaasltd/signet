# Docker-free development deployment. Apply k8s/signet.yaml first to create
# the signet-state PVC. Production deployments should use the image from
# Dockerfile instead of compiling from a ConfigMap at pod start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signet
  namespace: openfaas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signet
  template:
    metadata:
      labels:
        app: signet
    spec:
      containers:
        - name: signet
          image: golang:1.25
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args: ["exec go run /app/main.go /app/config.go /app/jwt.go /app/server.go --listen :8080 --config /etc/signet/config.json --key /var/lib/signet/signet.key"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
            - name: config
              mountPath: /etc/signet
              readOnly: true
            - name: key
              mountPath: /var/lib/signet
      volumes:
        - name: source
          configMap:
            name: signet-source
        - name: config
          secret:
            secretName: signet-config
        - name: key
          persistentVolumeClaim:
            claimName: signet-state
