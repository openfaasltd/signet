apiVersion: v1
kind: Namespace
metadata:
  name: openfaas
---
apiVersion: v1
kind: Secret
metadata:
  name: signet-config
  namespace: openfaas
type: Opaque
stringData:
  config.json: |
    {
      "issuer": "http://signet.openfaas.svc:8080",
      "users": [
        {
          "username": "admin",
          "password": "change-me",
          "subject": "admin",
          "name": "Signet Admin",
          "email": "admin@example.com",
          "groups": ["admin"]
        }
      ],
      "clients": [
        {
          "id": "openfaas",
          "secret": "change-me",
          "redirect_urls": ["http://127.0.0.1:3000/callback"]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: signet
  namespace: openfaas
spec:
  selector:
    app: signet
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: signet-external
  namespace: openfaas
spec:
  type: NodePort
  selector:
    app: signet
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signet-state
  namespace: openfaas
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: signet-master
  namespace: openfaas
type: Opaque
stringData:
  # A 32-byte AES-256 key (base64/padded text is trimmed). Generate with:
  #   head -c 32 /dev/urandom > master.key  (or use openssl rand -hex / base64)
  # DO NOT commit this value. Store the real key in your vault and render it
  # here. It encrypts config.json at rest and is never written to the PVC.
  master.key: "00000000000000000000000000000000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signet
  namespace: openfaas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signet
  template:
    metadata:
      labels:
        app: signet
    spec:
      initContainers:
        - name: prepare-state
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 65532:65532 /var/lib/signet && chmod 700 /var/lib/signet && chmod 600 /var/lib/signet/signet.key"]
          volumeMounts:
            - name: key
              mountPath: /var/lib/signet
      containers:
        - name: signet
          image: docker.io/alexellis2/signet:v0.0.2
          imagePullPolicy: IfNotPresent
          args: ["up", "--listen", ":8080", "--config", "/etc/signet/config.json", "--state-dir", "/var/lib/signet", "--master-key-file", "/var/run/secrets/signet-master/master.key", "--license-file", "/var/run/secrets/signet-license/license"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/signet
              readOnly: true
            - name: key
              mountPath: /var/lib/signet
            - name: master
              mountPath: /var/run/secrets/signet-master
              readOnly: true
            - name: license
              mountPath: /var/run/secrets/signet-license
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: signet-config
        - name: key
          persistentVolumeClaim:
            claimName: signet-state
        - name: master
          secret:
            secretName: signet-master
            items:
              - key: master.key
                path: master.key
        - name: license
          secret:
            secretName: openfaas-license
            items:
              - key: license
                path: license
