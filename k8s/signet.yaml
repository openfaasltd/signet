apiVersion: v1
kind: Namespace
metadata:
  name: openfaas
---
apiVersion: v1
kind: Secret
metadata:
  name: signet-config
  namespace: openfaas
type: Opaque
stringData:
  config.json: |
    {
      "issuer": "http://signet.openfaas.svc:8080",
      "users": [
        {
          "username": "admin",
          "password": "change-me",
          "subject": "admin",
          "name": "Signet Admin",
          "email": "admin@example.com",
          "groups": ["admin"]
        }
      ],
      "clients": [
        {
          "id": "openfaas",
          "secret": "change-me",
          "redirect_urls": ["http://127.0.0.1:3000/callback"]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: signet
  namespace: openfaas
spec:
  selector:
    app: signet
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: signet-external
  namespace: openfaas
spec:
  type: NodePort
  selector:
    app: signet
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signet-state
  namespace: openfaas
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signet
  namespace: openfaas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signet
  template:
    metadata:
      labels:
        app: signet
    spec:
      containers:
        - name: signet
          image: ghcr.io/openfaasltd/signet:latest
          imagePullPolicy: IfNotPresent
          args: ["--listen", ":8080", "--config", "/etc/signet/config.json", "--key", "/var/lib/signet/signet.key"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/signet
              readOnly: true
            - name: key
              mountPath: /var/lib/signet
      volumes:
        - name: config
          secret:
            secretName: signet-config
        - name: key
          persistentVolumeClaim:
            claimName: signet-state
